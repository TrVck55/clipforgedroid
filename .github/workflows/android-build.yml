name: Android CI (Build APK)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: "assembleDebug or assembleRelease"
        default: "assembleDebug"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Install NDK & CMake
        run: sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew ${{ github.event.inputs.build_type || 'assembleDebug' }} --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-apk
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          
